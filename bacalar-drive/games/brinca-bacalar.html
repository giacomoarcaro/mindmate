<!doctype html>
<html lang="es-MX">
<head>

<style>
  :root { --lime: #b4e23c; --coal: #20252a; --pink: #ff5fa2; --gold: #ffd23f; --ink: #f4f6f2; }

  .score { margin-left: auto; text-align: right; text-shadow: 0 2px 0 rgba(0,0,0,.45); }

  .score small { font-size: 12px; font-weight: 700; opacity: .9; }

  .banner { position: fixed; left: 50%; top: 24%; transform: translate(-50%, -20px) scale(.8); background: var(--pink); color: #fff; font-weight: 900; font-size: 22px; text-align: center; padding: 12px 20px; border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.35); opacity: 0; transition: all .25s; pointer-events: none; max-width: 90%; }

<script>
'use strict';
/* ======================= MARCA =======================
   Para usar el logo oficial pega aquí la imagen como data URL base64
   (por ejemplo 'data:image/png;base64,iVBOR...'). Vacío = logo dibujado con texto. */
const LOGO_BASE64 = '';
const WHATSAPP = '393661512335';
const SITE = 'https://bacalarjunglegym.com/';

/* ======================= BALANCE =======================
   Los tres números para hacerlo más fácil o más difícil: */
const SPEED_BASE = 1.15;   // casillas/segundo de los vehículos al inicio (más bajo = más fácil)
const RAIN_SPEED = 0.42;   // filas/segundo que avanza el aguacero al inicio (más bajo = más fácil)
const RAMP_ROWS = 160;     // filas que tarda en llegar a la dificultad máxima (más alto = más fácil)
/* Otros ajustes */
const EASY_ROWS = 20;      // primeras filas siempre suaves
const HOP = 0.11;          // segundos que dura un brinco
const HALF = 4;            // columnas jugables: -4..4
const WRAP = 11;           // los vehículos dan la vuelta en ±WRAP
const PRIZE_AT = 30, GYM_EVERY = 50;

const C = { lime: '#b4e23c', coal: '#20252a', pink: '#ff5fa2', gold: '#ffd23f' };
const WATER = ['#0b6fa4', '#1489b8', '#1fa3c4', '#35bccb', '#5fd0cf', '#8fe0d6', '#bdeee0'];

/* ======================= GUARDADO ======================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem('brinca-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('brinca-' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};
let best = store.get('best', 0), coins = store.get('coins', 0), owned = store.get('chars', ['tucan']), charId = store.get('char', 'tucan');
let muted = store.get('muted', false);

/* ======================= SONIDO (WebAudio) ======================= */
let ac = null;
function tone(f, d, type, vol, slide) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) { /* sin audio */ }
}
const sfx = {
  hop() { tone(420, 0.07, 'square', 0.05, 640); },
  coin() { tone(880, 0.08, 'triangle', 0.1); setTimeout(() => tone(1320, 0.12, 'triangle', 0.1), 70); },
  hit() { tone(180, 0.35, 'sawtooth', 0.14, 50); },
  splash() { tone(600, 0.3, 'sine', 0.12, 90); },
  record() { [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.1), i * 90)); },
  gym() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'square', 0.07), i * 80)); },
};
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* sin vibración */ } };

/* ======================= PERSONAJES =======================
   Cada uno es una lista de bloques [x, fondo, z, ancho, largo, alto, color]. */
const sk = '#d9a066';
const CHARS = [
  { id: 'tucan', name: 'Tucán del gym', cost: 0, parts: [
    [-.1, 0, 0, .08, .12, .06, '#ff8a1e'], [.1, 0, 0, .08, .12, .06, '#ff8a1e'], [0, 0, .06, .44, .4, .36, '#1b2024'],
    [0, -.17, .1, .3, .08, .22, '#fdf6d8'], [0, .28, .44, .16, .3, .14, '#ffb020'], [0, .02, .42, .36, .34, .26, '#1b2024'], [0, .02, .58, .38, .36, .07, C.lime]] },
  { id: 'brownie', name: 'Brownie', cost: 25, parts: [
    [-.12, .2, 0, .09, .09, .12, '#5a3a22'], [.12, .2, 0, .09, .09, .12, '#5a3a22'], [-.12, -.2, 0, .09, .09, .12, '#5a3a22'], [.12, -.2, 0, .09, .09, .12, '#5a3a22'],
    [0, 0, .12, .36, .58, .26, '#7a4f2e'], [0, -.3, .34, .08, .08, .18, '#5a3a22'], [0, .3, .32, .32, .26, .26, '#8a5a36'], [-.13, .3, .58, .08, .1, .1, '#4a2f1a'], [.13, .3, .58, .08, .1, .1, '#4a2f1a'], [0, .16, .3, .34, .06, .07, C.lime]] },
  { id: 'coach', name: 'El Coach', cost: 50, parts: [
    [-.1, 0, 0, .13, .16, .3, C.coal], [.1, 0, 0, .13, .16, .3, C.coal], [0, 0, .3, .4, .24, .34, C.lime], [-.25, 0, .34, .09, .12, .28, sk], [.25, 0, .34, .09, .12, .28, sk],
    [0, 0, .64, .28, .26, .24, sk], [0, 0, .88, .3, .28, .06, '#2a1c12']] },
  { id: 'dona', name: 'Doña Lupita', cost: 75, parts: [
    [0, 0, 0, .48, .42, .34, C.pink], [0, 0, .34, .4, .3, .28, '#1f8a8c'], [0, -.14, .4, .44, .06, .16, '#e3b04b'], [0, 0, .62, .26, .24, .22, sk], [0, .04, .84, .28, .26, .06, '#2a1c12'], [0, -.14, .7, .14, .1, .14, '#2a1c12']] },
  { id: 'lucha', name: 'El Enmascarado', cost: 100, parts: [
    [-.1, 0, 0, .13, .16, .26, sk], [.1, 0, 0, .13, .16, .26, sk], [0, 0, .26, .36, .22, .12, '#d83a3a'], [0, 0, .38, .42, .24, .28, sk], [0, -.15, .3, .4, .05, .36, C.pink],
    [0, 0, .66, .3, .28, .26, '#2f6fd8'], [0, 0, .92, .16, .14, .05, C.gold]] },
  { id: 'coati', name: 'Coatí', cost: 150, parts: [
    [-.11, .16, 0, .08, .08, .1, '#3a2416'], [.11, .16, 0, .08, .08, .1, '#3a2416'], [-.11, -.16, 0, .08, .08, .1, '#3a2416'], [.11, -.16, 0, .08, .08, .1, '#3a2416'],
    [0, 0, .1, .32, .52, .24, '#a8642e'], [0, -.28, .3, .09, .09, .12, '#3a2416'], [0, -.28, .42, .09, .09, .12, '#e8c9a0'], [0, -.28, .54, .09, .09, .12, '#3a2416'], [0, -.28, .66, .09, .09, .1, '#e8c9a0'],
    [0, .42, .22, .12, .2, .1, '#f0dcc0'], [0, .26, .2, .28, .24, .24, '#b8733a']] },
  { id: 'perico', name: 'Perico', cost: 200, parts: [
    [-.1, 0, 0, .08, .12, .06, '#888'], [.1, 0, 0, .08, .12, .06, '#888'], [0, 0, .06, .4, .38, .36, '#2fae4a'], [0, -.17, .1, .26, .08, .2, '#ffd23f'], [0, -.24, .14, .14, .2, .08, '#d83a3a'],
    [0, .24, .46, .14, .18, .12, '#f2a541'], [0, .02, .42, .34, .32, .26, '#3cc45a'], [0, .1, .68, .2, .14, .05, '#d83a3a']] },
  { id: 'oro', name: 'Tucán de Oro', cost: -1, parts: [
    [-.1, 0, 0, .08, .12, .06, '#c98a00'], [.1, 0, 0, .08, .12, .06, '#c98a00'], [0, 0, .06, .44, .4, .36, '#ffc93c'],
    [0, -.17, .1, .3, .08, .22, '#fff3b0'], [0, .28, .44, .16, .3, .14, '#ff9d1e'], [0, .02, .42, .36, .34, .26, '#ffd65c'], [0, .02, .58, .38, .36, .07, '#fff']] },
];
CHARS.forEach((c) => c.parts.sort((a, b) => b[1] - a[1] || a[2] - b[2]));
const charOf = (id) => CHARS.find((c) => c.id === id) || CHARS[0];

/* ======================= DIBUJO EN BLOQUES ======================= */
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, T = 50, DPR = 1;
const SH = 0.28, RY = 0.74;   // inclinación lateral y compresión del fondo
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  T = Math.max(34, Math.min(W / 7.2, H / 12.5));
}
addEventListener('resize', resize); resize();

const shadeCache = new Map();
function shade(hex, f) {
  const k = hex + f; let v = shadeCache.get(k); if (v) return v;
  const n = parseInt(hex.slice(1).length === 3 ? hex.slice(1).replace(/./g, '$&$&') : hex.slice(1), 16);
  const ch = (s) => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  v = 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')'; shadeCache.set(k, v); return v;
}
/** Bloque: origen en pantalla (ox, oy), escala s, centro (x, y fondo), base z, tamaño (w, d, h). */
function bx(c, ox, oy, s, x, y, z, w, d, h, col) {
  const x0 = ox + (x - w / 2) * s + (y - d / 2) * s * SH, y0 = oy - (y - d / 2) * s * RY - z * s;   // frente abajo izq.
  const ws = w * s, hs = h * s, dx = d * s * SH, dy = d * s * RY;
  c.fillStyle = shade(col, 0.62);   // cara derecha
  c.beginPath(); c.moveTo(x0 + ws, y0); c.lineTo(x0 + ws + dx, y0 - dy); c.lineTo(x0 + ws + dx, y0 - dy - hs); c.lineTo(x0 + ws, y0 - hs); c.fill();
  c.fillStyle = shade(col, 0.82);   // frente
  c.fillRect(x0, y0 - hs, ws + 0.5, hs);
  c.fillStyle = col;                // techo
  c.beginPath(); c.moveTo(x0, y0 - hs); c.lineTo(x0 + ws, y0 - hs); c.lineTo(x0 + ws + dx, y0 - hs - dy); c.lineTo(x0 + dx, y0 - hs - dy); c.fill();
}
function drawChar(c, ox, oy, s, ch, squash) {
  const k = squash || 1;
  for (const p of ch.parts) bx(c, ox, oy, s, p[0] / Math.sqrt(k), p[1], p[2] * k, p[3] / Math.sqrt(k), p[4], p[5] * k, p[6]);
}

/* ======================= MUNDO ======================= */
let seed = 1;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const pick = (a) => a[Math.floor(rnd() * a.length)];
let rows, queue, pathCol, lastType;
const diff = (r) => Math.max(0, Math.min(1, (r - EASY_ROWS) / RAMP_ROWS));

function movers(r, kinds, speed, gapMin) {
  const dir = rnd() < 0.5 ? -1 : 1, list = [];
  let x = -WRAP + rnd() * 3;
  while (x < WRAP - 1) {
    const k = pick(kinds);
    list.push({ x: x + k.len / 2, len: k.len, kind: k });
    x += k.len + gapMin + rnd() * gapMin * 0.8;
  }
  return { v: dir * speed, list };
}
const VEH = [
  { n: 'moto', len: 1, col: C.lime, h: .5 }, { n: 'jeep', len: 1.5, col: C.pink, h: .5 }, { n: 'jeep', len: 1.5, col: '#f4f6f2', h: .5 },
  { n: 'camion', len: 2.3, col: '#e3482f', h: .8 }, { n: 'bici', len: .7, col: '#43c9cb', h: .3 },
];
const BOATS = [{ n: 'lancha', len: 3, col: '#f4f6f2' }, { n: 'kayak', len: 2, col: '#ff8a1e' }, { n: 'tabla', len: 1.2, col: C.gold }];
const CARTS = [{ n: 'carro', len: 1, col: '#ffd23f', h: .6, txt: 'ELOTES' }, { n: 'carro', len: 1, col: '#ff8fb8', h: .6, txt: 'MARQUESITAS' }];

function staticRow(r, type, density, kinds) {
  const row = { type, obs: {}, coins: {} };
  const prev = pathCol;
  pathCol = Math.max(-HALF, Math.min(HALF, pathCol + Math.floor(rnd() * 3) - 1));
  for (let c = -HALF; c <= HALF; c++) {
    if (c === prev || c === pathCol) continue;
    if (rnd() < density) row.obs[c] = pick(kinds);
  }
  for (let c = -HALF; c <= HALF; c++) if (!row.obs[c] && rnd() < 0.07) row.coins[c] = 1;
  return row;
}
function nextSegment(r) {
  const d = diff(r), easy = r < EASY_ROWS;
  let type;
  do { type = pick(['road', 'road', 'road', 'water', 'water', 'selva', 'selva', 'cenote', 'market']); } while (type === lastType);
  lastType = type;
  const n = easy ? 1 : 1 + Math.floor(rnd() * (1.2 + 3 * d));
  if (type === 'road') {
    for (let i = 0; i < n; i++) {
      const sp = SPEED_BASE * (1 + 2.3 * d) * (0.8 + rnd() * 0.5);
      const row = { type, obs: {}, coins: {}, mv: movers(r, easy ? VEH.slice(0, 3) : VEH, sp, 3 + (1 - d) * 3) };
      for (let c = -HALF; c <= HALF; c++) if (rnd() < 0.05) row.coins[c] = 1;
      queue.push(row);
    }
  } else if (type === 'water') {
    const m = easy ? 1 : Math.min(n, 3);
    let dir = rnd() < 0.5 ? -1 : 1;
    for (let i = 0; i < m; i++) {
      const kinds = d < 0.35 ? [BOATS[0]] : d < 0.7 ? [BOATS[0], BOATS[1]] : BOATS;
      const mv = movers(r, kinds, (0.75 + 1.3 * d) * (0.85 + rnd() * 0.4), 1.4 + d * 1.2);
      mv.v = Math.abs(mv.v) * dir; dir = -dir;
      queue.push({ type, obs: {}, coins: {}, mv, tone: i });
    }
    queue.push(staticRow(r, 'selva', 0.08, ['bush']));
    return;
  } else if (type === 'selva') {
    for (let i = 0; i < n; i++) {
      const row = staticRow(r, 'selva', 0.16 + 0.2 * d, ['palm', 'ceiba', 'bush', 'palm']);
      if (!easy && rnd() < 0.2) row.mv = { v: (rnd() < 0.5 ? -1 : 1) * 2.2, list: [{ x: -WRAP + rnd() * 6, len: .8, kind: { n: 'coati', len: .8, col: '#a8642e', h: .3 } }] };
      queue.push(row);
    }
  } else if (type === 'cenote') {
    for (let i = 0; i < Math.min(n, 2); i++) queue.push(staticRow(r, 'cenote', 0.2 + 0.22 * d, ['hole']));
  } else {
    queue.push(staticRow(r, 'market', 0.3, ['stall']));
    queue.push({ type: 'market', obs: {}, coins: {}, mv: movers(r, CARTS, 0.6 + 0.9 * d, 3.5) });
    if (!easy) queue.push(staticRow(r, 'market', 0.3, ['stall']));
  }
  if (easy || rnd() > d * 0.6) queue.push(staticRow(r, 'selva', 0.1, ['bush', 'palm']));
}
function rowAt(r) {
  let row = rows.get(r);
  if (row) return row;
  if (r < 4) row = { type: 'plaza', obs: {}, coins: {} };
  else if (r % GYM_EVERY === 0) {
    // la puerta queda cerca del centro para que siempre se vea en el teléfono
    const door = Math.max(-2, Math.min(2, pathCol));
    row = { type: 'gym', obs: {}, coins: {}, door, used: false };
    for (const c of [door - 1, door + 1]) if (c !== pathCol) row.obs[c] = 'gymwall';
    queue.unshift({ type: 'plaza', obs: {}, coins: {} });   // salida libre después del gym
  } else {
    if (!queue.length) nextSegment(r);
    row = queue.shift();
  }
  rows.set(r, row);
  return row;
}

const DT = 1 / 60;
let acc = 0, lastT = 0;
function tick(real) {
  if (slow > 0) { slow -= real; if (slow <= 0 && state === 'dead') finish(); }
  shake = Math.max(0, shake - real * 1.6);
  if (gymMsg > 0 && (gymMsg -= real) <= 0) document.getElementById('banner').classList.remove('on');
  acc += real * (slow > 0 ? 0.25 : 1);
  let n = 0;
  while (acc >= DT && n++ < 8) { step(DT); acc -= DT; }
  if (n >= 8) acc = 0;
  cam.t = Math.max(cam.t, P.r - 1.5);   // la cámara nunca regresa
  cam.r += (cam.t - cam.r) * Math.min(1, real * 6);
  cam.x += (P.x * 0.6 - cam.x) * Math.min(1, real * 6);
}
function frame(now) {
  const real = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now;
  tick(real); render();
  requestAnimationFrame(frame);
}

  const msg = '¡Hola Jungle Gym! Hice ' + score + ' puntos en Brinca Bacalar y quiero reclamar mi primer día gratis.' + (prize ? ' Mi código: ' + prize : '');
  document.getElementById('end-card').innerHTML =
    '<h1>' + WHY[deadWhy] + '</h1>' + (newBest ? '<span class="new">NUEVO RÉCORD</span>' : '') +
    '<div class="nums"><div><b>' + score + '</b><small>PUNTOS</small></div><div><b>' + best + '</b><small>RÉCORD</small></div><div><b class="coins">' + runCoins + '</b><small>DISCOS</small></div></div>' +
    (prize ? '<div class="prize">Ganaste tu primer día gratis<br><b>' + prize + '</b><br><a href="' + SITE + '" target="_blank" rel="noopener">bacalarjunglegym.com</a></div>' : '<p>Llega a ' + PRIZE_AT + ' puntos y gana un código de premio.</p>') +
    '<p class="daily">' + esc(dailyText()) + '</p>' +
    '<button class="btn b-play" id="e-again">Jugar otra vez</button>' +
    '<a class="btn b-wa" id="e-wa" target="_blank" rel="noopener" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg) + '">Reclama tu día gratis por WhatsApp</a>' +
    '<div class="row2"><button class="btn b-ghost" id="e-share">Compartir</button><button class="btn b-ghost" id="e-chars">Personajes</button></div>';
  document.getElementById('p-end').classList.add('on');
  document.getElementById('e-again').onclick = reset;
  document.getElementById('e-share').onclick = share;
  document.getElementById('e-chars').onclick = showChars;
}
async function share() {
  const url = location.href.split('?')[0];
  const text = 'Hice ' + score + ' puntos en Brinca Bacalar, el juego del Bacalar Jungle Gym. ¿Me ganas? ' + url;
  try {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1080; const x = c.getContext('2d');
    x.fillStyle = C.coal; x.fillRect(0, 0, 1080, 1080); x.fillStyle = C.lime; x.fillRect(0, 0, 1080, 26); x.fillRect(0, 1054, 1080, 26);
    x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '900 84px system-ui, sans-serif'; x.fillText('BRINCA BACALAR', 540, 190);
    x.fillStyle = C.lime; x.font = '900 330px system-ui, sans-serif'; x.fillText(String(score), 540, 560);
    x.fillStyle = '#fff'; x.font = '800 56px system-ui, sans-serif'; x.fillText('puntos · ¿me ganas?', 540, 660);
    drawChar(x, 540, 900, 260, charOf(charId), 1);
    x.fillStyle = C.pink; x.font = '900 52px system-ui, sans-serif'; x.fillText('Bacalar Jungle Gym · 1er día GRATIS', 540, 1010);
    const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
    const file = blob && new File([blob], 'brinca-bacalar.png', { type: 'image/png' });
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
  } catch (e) { /* sigue con el enlace */ }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
}
function showChars() {
  document.getElementById('c-coins').textContent = coins;
  const box = document.getElementById('chars'); box.innerHTML = '';
  for (const ch of CHARS) {
    const has = owned.includes(ch.id);
    const el = document.createElement('button');
    el.className = 'ch' + (ch.id === charId ? ' sel' : '') + (has ? '' : ' lock');
    const c = document.createElement('canvas'); c.width = 168; c.height = 168;
    drawChar(c.getContext('2d'), 72, 150, 165, ch, 1);
    el.appendChild(c);
    el.insertAdjacentHTML('beforeend', esc(ch.name) + '<small>' + (ch.id === charId ? 'Elegido' : has ? 'Usar' : ch.cost < 0 ? 'Código del gym' : '● ' + ch.cost) + '</small>');
    el.onclick = () => {
      if (!has) {
        if (ch.cost < 0 || coins < ch.cost) { tone(140, 0.08, 'square', 0.05); return; }
        coins -= ch.cost; owned.push(ch.id); store.set('coins', coins); store.set('chars', owned); sfx.record();
      }
      charId = ch.id; store.set('char', charId); hud(); showChars();
    };
    box.appendChild(el);
  }
  document.getElementById('p-chars').classList.add('on');
}
document.getElementById('c-close').onclick = () => document.getElementById('p-chars').classList.remove('on');
document.getElementById('b-chars').onclick = showChars;
document.getElementById('codeform').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('codemsg'), code = document.getElementById('code').value.toUpperCase().trim();
  msg.textContent = 'Comprobando…';
  let ok = false;
  try { ok = (await (await fetch('./canjear?c=' + encodeURIComponent(code))).json()).ok === true; } catch (err) { ok = false; }
  if (ok) { if (!owned.includes('oro')) owned.push('oro'); charId = 'oro'; store.set('chars', owned); store.set('char', charId); sfx.gym(); msg.textContent = '¡Listo! Desbloqueaste al Tucán de Oro.'; showChars(); }
  else msg.textContent = 'Ese código no es el de esta semana. Pasa por el gym a verlo.';
};
const muteBtn = document.getElementById('b-mute');
function setMute(m) { muted = m; store.set('muted', m); muteBtn.textContent = m ? 'Sin sonido' : 'Sonido'; }
muteBtn.onclick = () => setMute(!muted); setMute(muted);
document.getElementById('logo').innerHTML = LOGO_BASE64 ? '<img class="logo" alt="Bacalar Jungle Gym" src="' + LOGO_BASE64 + '">' : '<div class="logo-txt">BACALAR<b>JUNGLE GYM</b></div>';

/* ======================= CONTROLES ======================= */
let down = null;
cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.hypot(dx, dy) < 24) move(0, 1);
  else if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
  else move(0, dy > 0 ? -1 : 1);
});
addEventListener('keydown', (e) => {
  const k = e.code;
  if (state === 'over' && (k === 'Space' || k === 'Enter') && !document.getElementById('p-chars').classList.contains('on')) { reset(); e.preventDefault(); return; }
  if (k === 'ArrowUp' || k === 'KeyW' || k === 'Space') move(0, 1);
  else if (k === 'ArrowDown' || k === 'KeyS') move(0, -1);
  else if (k === 'ArrowLeft' || k === 'KeyA') move(-1, 0);
  else if (k === 'ArrowRight' || k === 'KeyD') move(1, 0);
  else if (k === 'KeyM') setMute(!muted);
  else return;
  e.preventDefault();
});

reset();
window.__brinca = { step, move, get s() { return { state, score, r: P.r, x: P.x, rain, coins, why: deadWhy }; }, rowAt, render, tick };
requestAnimationFrame(frame);
</script>
