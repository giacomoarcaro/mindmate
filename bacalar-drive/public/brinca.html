<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Brinca Bacalar</title>
<meta name="theme-color" content="#20252a">
<style>
  :root { --lime: #b4e23c; --coal: #20252a; --pink: #ff5fa2; --gold: #ffd23f; --ink: #f4f6f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--coal); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; pointer-events: none; }
  .logo { height: 44px; border-radius: 10px; }
  .logo-txt { font-weight: 900; font-size: 13px; line-height: 1.05; letter-spacing: .04em; background: var(--coal); border: 2px solid var(--lime); border-radius: 10px; padding: 6px 9px; }
  .logo-txt b { color: var(--lime); display: block; }
  .score { margin-left: auto; text-align: right; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
  .score b { font-size: 40px; line-height: 1; display: block; font-weight: 900; }
  .score small { font-size: 12px; font-weight: 700; opacity: .9; }
  .pill { pointer-events: auto; background: rgba(32,37,42,.82); border: 0; color: var(--ink); border-radius: 999px; padding: 8px 12px; font: 800 13px system-ui, sans-serif; cursor: pointer; }
  .coins { color: var(--gold); }
  .hint { position: fixed; left: 50%; bottom: calc(15% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); text-align: center; pointer-events: none; transition: opacity .3s; width: 90%; }
  .hint b { display: inline-block; background: var(--lime); color: var(--coal); font-size: 20px; font-weight: 900; padding: 10px 18px; border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
  .hint small { display: block; margin-top: 10px; font-weight: 700; font-size: 13px; text-shadow: 0 1px 3px #000; }
  .hint.off { opacity: 0; }
  .banner { position: fixed; left: 50%; top: 24%; transform: translate(-50%, -20px) scale(.8); background: var(--pink); color: #fff; font-weight: 900; font-size: 22px; text-align: center; padding: 12px 20px; border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.35); opacity: 0; transition: all .25s; pointer-events: none; max-width: 90%; }
  .banner small { display: block; font-size: 13px; font-weight: 700; }
  .banner.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .corner { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
  .panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,14,18,.6); padding: 14px; overflow: auto; }
  .panel.on { display: flex; }
  .card { width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--coal); border: 3px solid var(--lime); border-radius: 22px; padding: 18px; text-align: center; }
  .card h1 { margin: 0 0 4px; font-size: 24px; }
  .card p { margin: 6px 0; font-size: 14px; }
  .nums { display: flex; justify-content: center; gap: 26px; margin: 10px 0; }
  .nums div b { display: block; font-size: 38px; font-weight: 900; line-height: 1; }
  .nums div small { font-size: 12px; opacity: .8; font-weight: 700; }
  .new { display: inline-block; background: var(--gold); color: var(--coal); font-weight: 900; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .prize { background: #2b3138; border: 2px dashed var(--gold); border-radius: 14px; padding: 8px; margin: 10px 0; }
  .prize b { font-size: 22px; color: var(--gold); letter-spacing: .08em; }
  .prize a { color: var(--lime); font-weight: 800; }
  .btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 14px; margin-top: 10px; font: 900 17px system-ui, sans-serif; cursor: pointer; text-decoration: none; box-shadow: 0 5px 0 rgba(0,0,0,.4); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .b-play { background: var(--lime); color: var(--coal); font-size: 20px; }
  .b-wa { background: #25d366; color: #0b2a16; }
  .row2 { display: flex; gap: 10px; }
  .b-ghost { background: #333a42; color: var(--ink); font-size: 14px; }
  .daily { font-size: 13px; color: var(--lime); font-weight: 700; }
  .chars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
  .ch { background: #2b3138; border: 2px solid transparent; border-radius: 14px; padding: 8px; cursor: pointer; color: var(--ink); font: 700 13px system-ui, sans-serif; }
  .ch.sel { border-color: var(--lime); }
  .ch.lock { opacity: .75; }
  .ch canvas { position: static; width: 84px; height: 84px; display: block; margin: 0 auto; }
  .ch small { display: block; color: var(--gold); font-weight: 800; }
  .code { display: flex; gap: 8px; margin-top: 12px; }
  .code input { flex: 1; min-width: 0; border-radius: 12px; border: 2px solid #48515b; background: #15191d; color: var(--ink); padding: 10px; font: 800 16px system-ui, sans-serif; text-transform: uppercase; text-align: center; }
  .code button { width: auto; margin: 0; padding: 10px 14px; font-size: 14px; }
  #codemsg { font-size: 12px; opacity: .85; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <span id="logo"></span>
  <div class="score"><b id="s-now">0</b><small>Récord <span id="s-best">0</span> · <span class="coins">● <span id="s-coins">0</span></span></small></div>
</div>
<div class="hint" id="hint"><b>Toca para brincar</b><small>Desliza a los lados o atrás para moverte · llega al Jungle Gym</small></div>
<div class="banner" id="banner"></div>
<div class="corner">
  <button class="pill" id="b-mute">Sonido</button>
  <button class="pill" id="b-chars">Personajes</button>
  <a class="pill" href="./juegos.html" style="text-decoration:none">Arcade</a>
</div>
<div class="panel" id="p-end"><div class="card" id="end-card"></div></div>
<div class="panel" id="p-chars"><div class="card">
  <h1>Personajes</h1>
  <p>Junta discos <span class="coins">●</span> para desbloquearlos. Tienes <b class="coins" id="c-coins">0</b>.</p>
  <div class="chars" id="chars"></div>
  <form class="code" id="codeform"><input id="code" maxlength="5" placeholder="Código del gym" autocomplete="off"><button class="btn b-ghost" type="submit">Canjear</button></form>
  <p id="codemsg">El código de la semana está a la vista en el Jungle Gym y desbloquea al Tucán de Oro.</p>
  <button class="btn b-play" id="c-close">Listo</button>
</div></div>

    ac = ac || new (window.AudioContext || window.webkitAudioContext)();

    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;

    g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) { /* sin audio */ }
}

let W = 0, H = 0, T = 50, DPR = 1;
const SH = 0.28, RY = 0.74;   // inclinación lateral y compresión del fondo
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;

const shadeCache = new Map();
function shade(hex, f) {
  const k = hex + f; let v = shadeCache.get(k); if (v) return v;
  const n = parseInt(hex.slice(1).length === 3 ? hex.slice(1).replace(/./g, '$&$&') : hex.slice(1), 16);
  const ch = (s) => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  v = 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')'; shadeCache.set(k, v); return v;
}
/** Bloque: origen en pantalla (ox, oy), escala s, centro (x, y fondo), base z, tamaño (w, d, h). */
function bx(c, ox, oy, s, x, y, z, w, d, h, col) {
  const x0 = ox + (x - w / 2) * s + (y - d / 2) * s * SH, y0 = oy - (y - d / 2) * s * RY - z * s;   // frente abajo izq.
  const ws = w * s, hs = h * s, dx = d * s * SH, dy = d * s * RY;
  c.fillStyle = shade(col, 0.62);   // cara derecha
  c.beginPath(); c.moveTo(x0 + ws, y0); c.lineTo(x0 + ws + dx, y0 - dy); c.lineTo(x0 + ws + dx, y0 - dy - hs); c.lineTo(x0 + ws, y0 - hs); c.fill();
  c.fillStyle = shade(col, 0.82);   // frente
  c.fillRect(x0, y0 - hs, ws + 0.5, hs);
  c.fillStyle = col;                // techo
  c.beginPath(); c.moveTo(x0, y0 - hs); c.lineTo(x0 + ws, y0 - hs); c.lineTo(x0 + ws + dx, y0 - hs - dy); c.lineTo(x0 + dx, y0 - hs - dy); c.fill();
}
function drawChar(c, ox, oy, s, ch, squash) {
  const k = squash || 1;
  for (const p of ch.parts) bx(c, ox, oy, s, p[0] / Math.sqrt(k), p[1], p[2] * k, p[3] / Math.sqrt(k), p[4], p[5] * k, p[6]);
}

let seed = 1;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const pick = (a) => a[Math.floor(rnd() * a.length)];
let rows, queue, pathCol, lastType;
const diff = (r) => Math.max(0, Math.min(1, (r - EASY_ROWS) / RAMP_ROWS));

function movers(r, kinds, speed, gapMin) {
  const dir = rnd() < 0.5 ? -1 : 1, list = [];
  let x = -WRAP + rnd() * 3;
  while (x < WRAP - 1) {
    const k = pick(kinds);
    list.push({ x: x + k.len / 2, len: k.len, kind: k });
    x += k.len + gapMin + rnd() * gapMin * 0.8;
  }
  return { v: dir * speed, list };
}
const VEH = [
  { n: 'moto', len: 1, col: C.lime, h: .5 }, { n: 'jeep', len: 1.5, col: C.pink, h: .5 }, { n: 'jeep', len: 1.5, col: '#f4f6f2', h: .5 },
  { n: 'camion', len: 2.3, col: '#e3482f', h: .8 }, { n: 'bici', len: .7, col: '#43c9cb', h: .3 },
];
const BOATS = [{ n: 'lancha', len: 3, col: '#f4f6f2' }, { n: 'kayak', len: 2, col: '#ff8a1e' }, { n: 'tabla', len: 1.2, col: C.gold }];
const CARTS = [{ n: 'carro', len: 1, col: '#ffd23f', h: .6, txt: 'ELOTES' }, { n: 'carro', len: 1, col: '#ff8fb8', h: .6, txt: 'MARQUESITAS' }];

function staticRow(r, type, density, kinds) {
  const row = { type, obs: {}, coins: {} };
  const prev = pathCol;
  pathCol = Math.max(-HALF, Math.min(HALF, pathCol + Math.floor(rnd() * 3) - 1));
  for (let c = -HALF; c <= HALF; c++) {
    if (c === prev || c === pathCol) continue;
    if (rnd() < density) row.obs[c] = pick(kinds);
  }
  for (let c = -HALF; c <= HALF; c++) if (!row.obs[c] && rnd() < 0.07) row.coins[c] = 1;
  return row;
}
function nextSegment(r) {
  const d = diff(r), easy = r < EASY_ROWS;
  let type;
  do { type = pick(['road', 'road', 'road', 'water', 'water', 'selva', 'selva', 'cenote', 'market']); } while (type === lastType);
  lastType = type;
  const n = easy ? 1 : 1 + Math.floor(rnd() * (1.2 + 3 * d));
  if (type === 'road') {
    for (let i = 0; i < n; i++) {
      const sp = SPEED_BASE * (1 + 2.3 * d) * (0.8 + rnd() * 0.5);
      const row = { type, obs: {}, coins: {}, mv: movers(r, easy ? VEH.slice(0, 3) : VEH, sp, 3 + (1 - d) * 3) };
      for (let c = -HALF; c <= HALF; c++) if (rnd() < 0.05) row.coins[c] = 1;
      queue.push(row);
    }
  } else if (type === 'water') {
    const m = easy ? 1 : Math.min(n, 3);
    let dir = rnd() < 0.5 ? -1 : 1;
    for (let i = 0; i < m; i++) {
      const kinds = d < 0.35 ? [BOATS[0]] : d < 0.7 ? [BOATS[0], BOATS[1]] : BOATS;
      const mv = movers(r, kinds, (0.75 + 1.3 * d) * (0.85 + rnd() * 0.4), 1.4 + d * 1.2);
      mv.v = Math.abs(mv.v) * dir; dir = -dir;
      queue.push({ type, obs: {}, coins: {}, mv, tone: i });
    }
    queue.push(staticRow(r, 'selva', 0.08, ['bush']));
    return;
  } else if (type === 'selva') {
    for (let i = 0; i < n; i++) {
      const row = staticRow(r, 'selva', 0.16 + 0.2 * d, ['palm', 'ceiba', 'bush', 'palm']);
      if (!easy && rnd() < 0.2) row.mv = { v: (rnd() < 0.5 ? -1 : 1) * 2.2, list: [{ x: -WRAP + rnd() * 6, len: .8, kind: { n: 'coati', len: .8, col: '#a8642e', h: .3 } }] };
      queue.push(row);
    }
  } else if (type === 'cenote') {
    for (let i = 0; i < Math.min(n, 2); i++) queue.push(staticRow(r, 'cenote', 0.2 + 0.22 * d, ['hole']));
  } else {
    queue.push(staticRow(r, 'market', 0.3, ['stall']));
    queue.push({ type: 'market', obs: {}, coins: {}, mv: movers(r, CARTS, 0.6 + 0.9 * d, 3.5) });
    if (!easy) queue.push(staticRow(r, 'market', 0.3, ['stall']));
  }
  if (easy || rnd() > d * 0.6) queue.push(staticRow(r, 'selva', 0.1, ['bush', 'palm']));
}
function rowAt(r) {
  let row = rows.get(r);
  if (row) return row;
  if (r < 4) row = { type: 'plaza', obs: {}, coins: {} };
  else if (r % GYM_EVERY === 0) {
    // la puerta queda cerca del centro para que siempre se vea en el teléfono
    const door = Math.max(-2, Math.min(2, pathCol));
    row = { type: 'gym', obs: {}, coins: {}, door, used: false };
    for (const c of [door - 1, door + 1]) if (c !== pathCol) row.obs[c] = 'gymwall';
    queue.unshift({ type: 'plaza', obs: {}, coins: {} });   // salida libre después del gym
  } else {
    if (!queue.length) nextSegment(r);
    row = queue.shift();
  }
  rows.set(r, row);
  return row;
}

let state = 'ready', P, cam, rain, score, runCoins, shake = 0, slow = 0, time = 0, deadWhy = '', parts = [], pending = null, newBest = false, gymMsg = 0;
function reset() {
  seed = (Date.now() ^ 0x9e3779b9) >>> 0;
  rows = new Map(); queue = []; pathCol = 0; lastType = '';
  P = { x: 0, r: 0, fx: 0, fr: 0, t: HOP, idle: 0 };
  cam = { r: -1.5, t: -1.5, x: 0 }; rain = -7; score = 0; runCoins = 0; shake = 0; slow = 0; parts = []; pending = null; newBest = false;
  for (let r = 0; r < 24; r++) rowAt(r);
  state = 'ready';
  document.getElementById('hint').classList.remove('off');
  document.getElementById('p-end').classList.remove('on');
  hud();
}
function hud() {
  document.getElementById('s-now').textContent = score;
  document.getElementById('s-best').textContent = Math.max(best, score);
  document.getElementById('s-coins').textContent = coins;
}
function blocked(c, r) {
  if (c < -HALF || c > HALF || r < 0) return true;
  const o = rowAt(r).obs[c];
  return !!o && o !== 'hole';
}
function move(dx, dr) {
  if (state === 'dead' || state === 'over') return;
  if (document.querySelector('.panel.on')) return;
  if (state === 'ready') { state = 'play'; document.getElementById('hint').classList.add('off'); }
  if (P.t < HOP) { pending = [dx, dr]; return; }
  let nx = P.x + dx; const nr = P.r + dr;
  if (rowAt(nr).type !== 'water') nx = Math.round(nx);   // fuera del agua siempre en casilla entera
  if (blocked(Math.round(nx), nr)) { tone(140, 0.05, 'square', 0.04); return; }
  P.fx = P.x; P.fr = P.r; P.x = nx; P.r = nr; P.t = 0; P.idle = 0;
  sfx.hop();
  if (nr > score) {
    score = nr;
    if (best > 0 && score === best + 1 && !newBest) { newBest = true; sfx.record(); banner('¡Nuevo récord!', '', 1.4); }
    if (score % GYM_EVERY === GYM_EVERY - 6) banner('¡Jungle Gym adelante!', 'entra por la puerta rosa', 2.2);
    hud();
  }
}
function banner(t, sub, secs) {
  const el = document.getElementById('banner');
  el.innerHTML = t + (sub ? '<small>' + sub + '</small>' : '');
  el.classList.add('on'); gymMsg = secs;
}
function burst(x, r, col, n) {
  for (let i = 0; i < n; i++) parts.push({ x, r, z: 0.3, vx: (Math.random() - 0.5) * 4, vr: (Math.random() - 0.5) * 4, vz: 2 + Math.random() * 4, life: 0.7 + Math.random() * 0.5, col: Array.isArray(col) ? col[i % col.length] : col });
}
function die(why) {
  if (state !== 'play') return;
  state = 'dead'; deadWhy = why; slow = 0.55; shake = 0.5;
  buzz(why === 'water' || why === 'away' ? [40, 30, 80] : 180);
  if (why === 'water' || why === 'away' || why === 'hole') { sfx.splash(); burst(P.x, P.r, '#bdeee0', 14); } else { sfx.hit(); burst(P.x, P.r, [C.pink, C.gold, '#fff'], 16); }
}
function finish() {
  state = 'over';
  if (score > best) { best = score; store.set('best', best); }
  store.set('coins', coins);
  showEnd();
}
function step(dt) {
  time += dt;
  for (const p of parts) { p.x += p.vx * dt; p.r += p.vr * dt; p.z += p.vz * dt; p.vz -= 12 * dt; p.life -= dt; }
  parts = parts.filter((p) => p.life > 0 && p.z > -0.2);
  // vehículos, lanchas y carritos siempre se mueven
  for (let r = Math.floor(cam.r) - 5; r < Math.floor(cam.r) + 22; r++) {
    const row = r >= 0 ? rowAt(r) : null;
    if (!row || !row.mv) continue;
    for (const m of row.mv.list) { m.x += row.mv.v * dt; if (m.x > WRAP) m.x -= WRAP * 2; else if (m.x < -WRAP) m.x += WRAP * 2; }
  }
  if (state !== 'play') return;
  P.t += dt; P.idle += dt;
  if (P.t >= HOP && pending) { const m = pending; pending = null; move(m[0], m[1]); }
  const row = rowAt(P.r);
  // monedas
  const cc = Math.round(P.x);
  if (row.coins[cc] && P.t > HOP * 0.5) { delete row.coins[cc]; coins++; runCoins++; sfx.coin(); burst(cc, P.r, C.gold, 6); dailyAdd('coins', 1); hud(); }
  if (row.type === 'water') {
    if (P.t > HOP * 0.6) {
      const b = row.mv.list.find((m) => Math.abs(P.x - m.x) < m.len / 2 + 0.12);
      if (!b) return die('water');
      P.x += row.mv.v * dt;
      if (Math.abs(P.x) > HALF + 0.6) return die('away');
    }
  } else {
    if (row.obs[cc] === 'hole' && P.t > HOP * 0.7) return die('hole');
    if (row.mv) for (const m of row.mv.list) if (Math.abs(P.x - m.x) < m.len / 2 + 0.3) return die('car');
    if (row.type === 'gym' && cc === row.door && !row.used) {
      row.used = true; coins += 10; runCoins += 10; sfx.gym(); buzz([30, 30, 30, 30, 90]);
      burst(cc, P.r, [C.lime, C.pink, C.gold, '#fff'], 40);
      banner('Tu primer día es GRATIS', '+10 discos · Bacalar Jungle Gym', 3); hud();
    }
  }
  // aguacero: avanza siempre, más rápido con la distancia, y nunca se queda muy atrás
  const rs = RAIN_SPEED * (1 + 1.4 * diff(score)) * (P.idle > 2.5 ? 1.8 : 1);
  rain = Math.max(rain + rs * dt, score - 9);
  if (rain >= P.r - 0.2) die('rain');
}

function daily() {
  const day = new Date().toISOString().slice(0, 10);
  let d = store.get('daily', null);
  if (!d || d.day !== day) {
    const n = Math.floor(Date.now() / 864e5);
    d = n % 2 ? { day, kind: 'coins', goal: 20, n: 0, done: false } : { day, kind: 'rows', goal: 40, n: 0, done: false };
    store.set('daily', d);
  }
  return d;
}
function dailyAdd(kind, v) {
  const d = daily();
  if (d.kind !== kind || d.done) return;
  d.n = kind === 'rows' ? Math.max(d.n, v) : d.n + v;
  if (d.n >= d.goal) { d.done = true; coins += 15; banner('¡Reto del día cumplido!', '+15 discos', 2.2); sfx.record(); }
  store.set('daily', d);
}
function dailyText() {
  const d = daily();
  const what = d.kind === 'coins' ? 'junta ' + d.goal + ' discos' : 'llega a ' + d.goal + ' filas en una partida';
  return d.done ? 'Reto de hoy cumplido (+15 discos). Mañana hay otro.' : 'Reto de hoy: ' + what + ' · llevas ' + Math.min(d.n, d.goal) + ' de ' + d.goal;
}

    g.fillStyle = '#2ac0d8'; g.beginPath(); g.ellipse(o[0] + T * .03, o[1] + T * .07, T * .26, T * .16, 0, 0, 7); g.fill();

function drawMover(m, r, v) {

  else if (k.n === 'tabla') { B(x, r, -.05, m.len, .56, .1, k.col); B(x, r, .05, m.len - .5, .1, .02, C.pink); }

  else if (k.n === 'jeep') { B(x, r, .14, m.len, .72, .3, k.col); B(x - f * .15, r, .44, m.len * .5, .66, .28, C.coal); B(x + f * .45, r, 0, .26, .8, .26, '#111'); B(x - f * .45, r, 0, .26, .8, .26, '#111'); }
  else if (k.n === 'camion') { B(x - f * .25, r, .16, m.len - .6, .76, .78, k.col); B(x + f * (m.len / 2 - .3), r, .16, .56, .74, .5, '#f4f6f2'); B(x + f * .7, r, 0, .26, .82, .26, '#111'); B(x - f * .7, r, 0, .26, .82, .26, '#111'); label(x - f * .25, r - .38, .56, 'REFRESCOS', .15, '#fff'); }

function drawRow(r) {

  else if (t === 'water') { strip(r, WATER[(r + (row.tone || 0)) % 7], -WRAP, WRAP); const a = proj(-9 + ((time * 0.6 + r * 1.7) % 4), r); g.fillStyle = 'rgba(255,255,255,.25)'; for (let i = 0; i < 5; i++) g.fillRect(a[0] + i * T * 4, a[1], T * .5, 2); }
  else if (t === 'market') { strip(r, alt ? '#d9b98a' : '#cfae7e', -WRAP, WRAP); }
  else if (t === 'plaza' || t === 'gym') { strip(r, alt ? '#e4d3b0' : '#dcc9a2', -WRAP, WRAP); }
  else { strip(r, t === 'cenote' ? (alt ? '#8fb85a' : '#86ae52') : (alt ? '#6cbf4f' : '#63b548'), -WRAP, WRAP); }
  // selva a los lados: fuera del área de juego
  if (t !== 'road' && t !== 'water') { strip(r, alt ? '#2c7a3a' : '#297236', -WRAP, -HALF - .5); strip(r, alt ? '#2c7a3a' : '#297236', HALF + .5, WRAP); }
  if (best > 0 && r === best && state !== 'over') { const a = proj(-HALF - .5, r + .5), b = proj(HALF + .5, r + .5); g.strokeStyle = C.lime; g.lineWidth = 4; g.setLineDash([10, 6]); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.setLineDash([]); label(HALF - .6, r + .5, .12, 'RÉCORD ' + best, .2, C.lime); }
  if (r === -2) { 'BACALAR'.split('').forEach((ch, i) => { const col = ['#ff5fa2', '#ffd23f', '#43c9cb', '#b4e23c', '#ff8a1e', '#ff5fa2', '#43c9cb'][i]; B(i - 3, r, 0, .82, .4, 1.1, col); label(i - 3, r - .2, .55, ch, .62, '#fff'); }); }
  if (t !== 'road' && t !== 'water') {

    far.sort((a, b) => a - b).forEach((c, i) => { if (((r * 7 + i * 3) % 5) < 3) drawObs(((r + i) % 3) ? 'palm' : 'ceiba', c, r); });
    if (r > 3 && r % 9 === 4) { const c = -5.6; B(c, r, 0, .1, .1, 1, '#555'); B(c, r, 1, 1.9, .12, .9, C.coal); if (logoImg && logoImg.complete && logoImg.naturalWidth) { const o = proj(c, r - .06); g.drawImage(logoImg, o[0] - T * .42, o[1] - T * 1.86, T * .84, T * .84); } else { label(c, r - .06, 1.62, 'JUNGLE GYM', .24, C.lime); label(c, r - .06, 1.3, '1er día GRATIS', .19, '#fff'); } }

function drawPlayer() {

  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(o[0] + T * .05, o[1], T * .3 * (1 - z * .4), T * .14 * (1 - z * .4), 0, 0, 7); g.fill();

function render() {

  const first = Math.floor(cam.r) - 4, last = Math.floor(cam.r) + Math.ceil(H * 0.7 / (T * RY)) + 3;

/* ======================= BUCLE (paso fijo a 60 Hz) ======================= */
const DT = 1 / 60;
let acc = 0, lastT = 0;
function tick(real) {
  if (slow > 0) { slow -= real; if (slow <= 0 && state === 'dead') finish(); }
  shake = Math.max(0, shake - real * 1.6);
  if (gymMsg > 0 && (gymMsg -= real) <= 0) document.getElementById('banner').classList.remove('on');
  acc += real * (slow > 0 ? 0.25 : 1);
  let n = 0;
  while (acc >= DT && n++ < 8) { step(DT); acc -= DT; }
  if (n >= 8) acc = 0;
  cam.t = Math.max(cam.t, P.r - 1.5);   // la cámara nunca regresa
  cam.r += (cam.t - cam.r) * Math.min(1, real * 6);
  cam.x += (P.x * 0.6 - cam.x) * Math.min(1, real * 6);
}
function frame(now) {
  const real = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now;
  tick(real); render();
  requestAnimationFrame(frame);
}

/* ======================= PANTALLAS ======================= */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WHY = { car: '¡Te atropellaron!', water: '¡Al agua!', away: 'Te llevó la corriente', hole: 'Caíste al cenote', rain: 'Te alcanzó el aguacero' };
function prizeCode() {
  let c = store.get('prize', '');
  if (!c) { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; c = 'BJG-'; for (let i = 0; i < 5; i++) c += a[Math.floor(Math.random() * a.length)]; store.set('prize', c); }

}

    '<h1>' + WHY[deadWhy] + '</h1>' + (newBest ? '<span class="new">NUEVO RÉCORD</span>' : '') +
    '<div class="nums"><div><b>' + score + '</b><small>PUNTOS</small></div><div><b>' + best + '</b><small>RÉCORD</small></div><div><b class="coins">' + runCoins + '</b><small>DISCOS</small></div></div>' +
    (prize ? '<div class="prize">Ganaste tu primer día gratis<br><b>' + prize + '</b><br><a href="' + SITE + '" target="_blank" rel="noopener">bacalarjunglegym.com</a></div>' : '<p>Llega a ' + PRIZE_AT + ' puntos y gana un código de premio.</p>') +
    '<p class="daily">' + esc(dailyText()) + '</p>' +
    '<button class="btn b-play" id="e-again">Jugar otra vez</button>' +
    '<a class="btn b-wa" id="e-wa" target="_blank" rel="noopener" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg) + '">Reclama tu día gratis por WhatsApp</a>' +
    '<div class="row2"><button class="btn b-ghost" id="e-share">Compartir</button><button class="btn b-ghost" id="e-chars">Personajes</button></div>';
  document.getElementById('p-end').classList.add('on');

  document.getElementById('e-chars').onclick = showChars;
}
async function share() {
  const url = location.href.split('?')[0];
  const text = 'Hice ' + score + ' puntos en Brinca Bacalar, el juego del Bacalar Jungle Gym. ¿Me ganas? ' + url;
  try {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1080; const x = c.getContext('2d');
    x.fillStyle = C.coal; x.fillRect(0, 0, 1080, 1080); x.fillStyle = C.lime; x.fillRect(0, 0, 1080, 26); x.fillRect(0, 1054, 1080, 26);
    x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '900 84px system-ui, sans-serif'; x.fillText('BRINCA BACALAR', 540, 190);
    x.fillStyle = C.lime; x.font = '900 330px system-ui, sans-serif'; x.fillText(String(score), 540, 560);
    x.fillStyle = '#fff'; x.font = '800 56px system-ui, sans-serif'; x.fillText('puntos · ¿me ganas?', 540, 660);
    drawChar(x, 540, 900, 260, charOf(charId), 1);
    x.fillStyle = C.pink; x.font = '900 52px system-ui, sans-serif'; x.fillText('Bacalar Jungle Gym · 1er día GRATIS', 540, 1010);

function showChars() {
  document.getElementById('c-coins').textContent = coins;

    el.appendChild(c);
    el.insertAdjacentHTML('beforeend', esc(ch.name) + '<small>' + (ch.id === charId ? 'Elegido' : has ? 'Usar' : ch.cost < 0 ? 'Código del gym' : '● ' + ch.cost) + '</small>');
    el.onclick = () => {
      if (!has) {
        if (ch.cost < 0 || coins < ch.cost) { tone(140, 0.08, 'square', 0.05); return; }

const muteBtn = document.getElementById('b-mute');
function setMute(m) { muted = m; store.set('muted', m); muteBtn.textContent = m ? 'Sin sonido' : 'Sonido'; }

/* ======================= CONTROLES ======================= */
let down = null;
cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.hypot(dx, dy) < 24) move(0, 1);
  else if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
  else move(0, dy > 0 ? -1 : 1);
});
addEventListener('keydown', (e) => {
  const k = e.code;
  if (state === 'over' && (k === 'Space' || k === 'Enter') && !document.getElementById('p-chars').classList.contains('on')) { reset(); e.preventDefault(); return; }
  if (k === 'ArrowUp' || k === 'KeyW' || k === 'Space') move(0, 1);
  else if (k === 'ArrowDown' || k === 'KeyS') move(0, -1);
  else if (k === 'ArrowLeft' || k === 'KeyA') move(-1, 0);
  else if (k === 'ArrowRight' || k === 'KeyD') move(1, 0);
  else if (k === 'KeyM') setMute(!muted);
  else return;
  e.preventDefault();
});

reset();
window.__brinca = { step, move, get s() { return { state, score, r: P.r, x: P.x, rain, coins, why: deadWhy }; }, rowAt, render, tick };
requestAnimationFrame(frame);
